name: Build Android APK
run-name: Smart Life v0.6.3
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Arquivos principais"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Conferir assinatura permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Configure ANDROID_KEYSTORE_BASE64 nos Secrets do GitHub" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Configure KEYSTORE_PASSWORD nos Secrets do GitHub" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Configure KEY_ALIAS nos Secrets do GitHub" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Configure KEY_PASSWORD nos Secrets do GitHub" && exit 1)
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Aplicar identidade visual do Smart Life
        run: |
          cp -R android-icon/mipmap-* android/app/src/main/res/
          cp -R android-notification/drawable android/app/src/main/res/
          printf '%s\n' '<resources><color name="ic_launcher_background">#050806</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Ativar salvamento nativo em Downloads
        run: python3 android-native/install-native-downloads.py
      - name: Validar exportação e compartilhamento nativos
        run: |
          test -f android/app/src/main/java/com/smartlife/app/SmartLifeDownloadsPlugin.java
          grep -q 'registerPlugin(SmartLifeDownloadsPlugin.class)' android/app/src/main/java/com/smartlife/app/MainActivity.java
          grep -q 'name = "SmartLifeDownloads"' android/app/src/main/java/com/smartlife/app/SmartLifeDownloadsPlugin.java
          grep -q 'SmartLifeDownloads' www/app.js
          npm ls @capacitor/filesystem @capacitor/share
      - name: Restaurar chave permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/smart-life-upload.jks
      - name: Configurar versão e assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          python3 android-signing/configure-gradle.py --gradle android/app/build.gradle --version "$APP_VERSION"
      - name: Gerar APK release assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease
      - name: Nomear APK com a versão atual
        id: apk
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="Smart-Life-v${APP_VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/${APK_NAME}"
          echo "artifact_name=Smart-Life-APK-v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=Arquivos principais/android/app/build/outputs/apk/release/${APK_NAME}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
