name: Build Play Store AAB
run-name: Smart Life v0.4.8 • Play Store

on:
  workflow_dispatch: {}

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Arquivos principais"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Conferir segredos de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Configure ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Configure KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Configure KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Configure KEY_PASSWORD" && exit 1)
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Aplicar identidade visual do Smart Life
        run: |
          cp -R android-icon/mipmap-* android/app/src/main/res/
          printf '%s\n' '<resources><color name="ic_launcher_background">#050806</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
      - name: Gerar e assinar AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/Smart-Life-v0.4.8.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Life-v0.4.8-play-store-aab
          path: "Arquivos principais/android/app/build/outputs/bundle/release/Smart-Life-v0.4.8.aab"

